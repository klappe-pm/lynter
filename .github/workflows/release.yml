# Release on a version tag such as 0.1.0: lynter binaries for five targets, the
# plugin files, the offline config builder, checksums, and a GitHub release. The tag is the bare version,
# with no v prefix, because the Obsidian community directory reads the release
# whose tag equals the version in manifest.json. Publishing to npm and
# crates.io stays a manual owner step.
name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag matches the plugin manifest, the CLI crate and the npm package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(jq -r .version plugin/manifest.json)" = "$REF_NAME"
          test "$(jq -r .version manifest.json)" = "$REF_NAME"
          test "$(jq -r .version packaging/npm/package.json)" = "$REF_NAME"
          grep -qx "version = \"$REF_NAME\"" crates/lynter-cli/Cargo.toml

  binaries:
    name: binary ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: macos-15, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p lynter-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="lynter-${REF_NAME}-${TARGET}"
          mkdir -p dist "stage/$name"
          bin=lynter
          if [ "$EXT" = zip ]; then bin=lynter.exe; fi
          cp "target/$TARGET/release/$bin" "stage/$name/"
          cp LICENSE THIRD-PARTY-NOTICES.md "stage/$name/"
          cp packaging/licenses/rust-crates.txt "stage/$name/THIRD-PARTY-LICENSES.txt"
          if [ "$EXT" = zip ]; then
            (cd stage && 7z a "../dist/$name.zip" "$name" > /dev/null)
          else
            tar -C stage -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  plugin:
    name: plugin
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: cd plugin && npm ci --ignore-scripts && npm run build && npm test
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: plugin
          path: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css
          if-no-files-found: error

  builder:
    name: builder
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # The config builder as one HTML file that runs from disk, with the engine embedded.
      - run: npm run build:standalone -w @lynter/site
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: builder
          path: packages/site/public/lynter-config-builder.html
          if-no-files-found: error

  release:
    name: release
    needs: [binaries, plugin, builder]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum lynter-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: artifacts/*
          generate_release_notes: true
