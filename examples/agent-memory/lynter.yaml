version: 1
defaults:
  rules:
    strip-strong:
      enabled: true
    replace-em-dash:
      enabled: true
    paragraph-spacing:
      enabled: true
      blank-lines: 1
    list-style:
      enabled: true
      marker: '-'
      tighten: true
profiles:
  memory:
    match:
      path: ["memory/**"]
    rules:
      join-paragraph-lines-fix:
        enabled: true
      yaml-key-sort:
        enabled: true
        priority-keys: [name, description, type]
