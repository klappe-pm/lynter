# language: system runs the `lynter` binary found on PATH, so the hook needs no
# build step and no network at commit time. Install it first from a release
# download at https://github.com/klappe-pm/lynter/releases or with
# `cargo install --git https://github.com/klappe-pm/lynter.git lynter-cli`.
- id: lynter-check
  name: lynter check
  description: Check Markdown files with Lynter.
  entry: lynter check
  language: system
  types: [markdown]

- id: lynter-fix
  name: lynter fix
  description: Fix Markdown files in place with Lynter.
  entry: lynter fix
  language: system
  types: [markdown]
